# cloudflared 配置示例
# 放到 %USERPROFILE%\.cloudflared\config.yml
# 把 <TUNNEL_ID> 换成 `cloudflared tunnel create instabox-panel` 输出的 ID
# 把 panel.example.com 换成你自己的域名

tunnel: <TUNNEL_ID>
credentials-file: C:\Users\<你的用户名>\.cloudflared\<TUNNEL_ID>.json

ingress:
  - hostname: panel.example.com
    service: http://127.0.0.1:5174
  # 其它路径/域名都返回 404，避免误暴露
  - service: http_status:404
